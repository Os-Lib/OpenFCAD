name: Build Installers (Windows .exe & macOS .dmg)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenFCAD Windows .exe Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows .exe Installer (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: OpenFCAD-Windows-Installer-exe
          path: release/*.exe

  build-macos:
    name: macOS Installer (.dmg Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenFCAD macOS .dmg & .zip (arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Upload macOS .dmg Installers (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: OpenFCAD-macOS-Installers-dmg
          path: |
            release/*.dmg
            release/*-mac-*.zip

  publish-release:
    name: Publish GitHub Release (Windows .exe + macOS .dmg)
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Publish Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
