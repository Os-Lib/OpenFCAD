name: Build Installers (Windows .exe & macOS .dmg)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenFCAD Windows .exe Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows .exe Installer (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: OpenFCAD-Windows-Installer-exe
          path: release/*.exe

      - name: Publish Windows .exe to GitHub Releases (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true

  build-macos:
    name: macOS Installer (.dmg Apple Silicon & Intel)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenFCAD macOS .dmg & .zip (arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Upload macOS .dmg Installers (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: OpenFCAD-macOS-Installers-dmg
          path: |
            release/*.dmg
            release/*-mac-*.zip

      - name: Publish macOS .dmg to GitHub Releases (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*-mac-*.zip
          generate_release_notes: true
